name: Unzip Archive

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and clean up
        run: |
          for file in *.zip; do
            if [ -f "$file" ]; then
              unzip -o "$file"
              rm "$file"
            fi
          done

      - name: Commit extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Extract zip contents"
          git push
