name: Move Files to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move files from ConfluenceAI to root
        shell: bash
        run: |
          if [ -d "ConfluenceAI" ]; then
            shopt -s dotglob
            rm -rf ConfluenceAI/.git
            mv ConfluenceAI/* .
            rm -rf ConfluenceAI
          fi

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Move files from ConfluenceAI to root"
          git push
